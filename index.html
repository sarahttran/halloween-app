
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackYourTreat</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        #map {
            height: 500px;
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <h1 id="test" class="test2">TrackYourTreat</h1>
    <p>Find participating houses in your neighborhood!</p>

    
<form id="searchForm">
    <input
        id="searchInput"
        type="search"
        placeholder="Search a neighborhood or ZIP code"
        required
    >
    <button type="submit">Search</button>
</form>

<p id="searchMessage" role="status"></p>


<!-- Pin controls -->
<div class="pin-controls">
    <button id="placePinButton" type="button">
        Place Pin
    </button>

    <button id="myLocationButton" type="button">
        Find My Location
    </button>

    <button id="exportButton" type="button">
        Export CSV
    </button>
</div>

<p id="pinMessage" role="status"></p>



    <!-- This is where the map appears -->
    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    
    <script>
        // Create a map centered near UMBC
        const map = L.map("map").setView(
            [39.254, -76.714],
            15
        );

        // Add OpenStreetMap
        L.tileLayer(
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }
        ).addTo(map);

        // Add an example participating house
        L.marker([39.255, -76.713])
            .addTo(map)
            .bindPopup(
                "<b>Participating House</b><br>" +
                "Candy: Chocolate and gummies<br>" +
                "Hours: 6 PM - 9 PM"
            );

        
        // Neighborhood search
        const searchForm = document.getElementById("searchForm");
        const searchInput = document.getElementById("searchInput");
        const searchMessage = document.getElementById("searchMessage");

        searchForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const location = searchInput.value.trim();
            if (!location) return;

            searchMessage.textContent = "Searching...";

            try {
                const url =
                    "https://nominatim.openstreetmap.org/search" +
                    "?format=json&limit=1&q=" +
                    encodeURIComponent(location);

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Search request failed");
                }

                const results = await response.json();

                if (results.length === 0) {
                    searchMessage.textContent = "Location not found.";
                    return;
                }

                const result = results[0];

                map.setView(
                    [Number(result.lat), Number(result.lon)],
                    14
                );

                searchMessage.textContent = result.display_name;

            } catch (error) {
                searchMessage.textContent =
                    "Search unavailable. Please try again.";
            }
        });

        
        // End of your neighborhood search
        });

        // STEP 2: PASTE YOUR PIN FUNCTIONALITY HERE

        // Save and load pins
        const STORAGE_KEY = "trackYourTreatPins";

        let savedPins = JSON.parse(
            localStorage.getItem(STORAGE_KEY) || "[]"
        );

        let placingPin = false;

        const placePinButton =
            document.getElementById("placePinButton");

        const pinMessage =
            document.getElementById("pinMessage");

        // Display a pin on the map
        function displayPin(pin) {
            L.marker([pin.lat, pin.lng])
                .addTo(map)
                .bindPopup("Saved Halloween location");
        }

        // Restore pins when the website reloads
        savedPins.forEach(displayPin);

        // Activate pin placement
        placePinButton.addEventListener("click", function() {
            placingPin = !placingPin;

            placePinButton.textContent = placingPin
                ? "Cancel Placement"
                : "Place Pin";

            pinMessage.textContent = placingPin
                ? "Click the map to place your pin."
                : "";
        });

        // Save the location when the map is clicked
        map.on("click", function(event) {
            if (!placingPin) return;

            const pin = {
                lat: event.latlng.lat,
                lng: event.latlng.lng
            };

            savedPins.push(pin);

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(savedPins)
            );

            displayPin(pin);

            placingPin = false;
            placePinButton.textContent = "Place Pin";

            pinMessage.textContent = "Pin saved!";
        });

        // Find My Location button
        document.getElementById("myLocationButton")
            .addEventListener("click", function() {

                if (!navigator.geolocation) {
                    pinMessage.textContent =
                        "Geolocation is not supported.";
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        map.setView(
                            [
                                position.coords.latitude,
                                position.coords.longitude
                            ],
                            16
                        );
                    },
                    function() {
                        pinMessage.textContent =
                            "Unable to access your location.";
                    }
                );
            });

        // Export saved pins to CSV
        document.getElementById("exportButton")
            .addEventListener("click", function() {

                let csv = "latitude,longitude\n";

                savedPins.forEach(function(pin) {
                    csv += pin.lat + "," + pin.lng + "\n";
                });

                const blob = new Blob([csv], {
                    type: "text/csv"
                });

                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");

                link.href = url;
                link.download = "trackyourtreat-pins.csv";
                link.click();

                URL.revokeObjectURL(url);
            });

    </script>
</body>
</html>


    </script>
</body>
</html>
