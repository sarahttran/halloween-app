
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackYourTreat</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        #map {
            height: 500px;
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <h1 id="test" class="test2">TrackYourTreat</h1>
    <p>Find participating houses in your neighborhood!</p>

    <!-- This is where the map appears -->
    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Create a map centered near UMBC
        const map = L.map("map").setView(
            [39.254, -76.714],
            15
        );

        // Add OpenStreetMap
        L.tileLayer(
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }
        ).addTo(map);

        // Add an example participating house
        L.marker([39.255, -76.713])
            .addTo(map)
            .bindPopup(
                "<b>Participating House</b><br>" +
                "Candy: Chocolate and gummies<br>" +
                "Hours: 6 PM - 9 PM"
            );
    </script>
</body>
</html>
